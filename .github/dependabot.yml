# Keep dependencies current with weekly Dependabot PRs. Low-risk minor/patch bumps are grouped into
# a single PR each to keep the noise down; majors still arrive as their own PRs for a proper look.
#
# @paul80nd/rcasm lives on GitHub Packages, which needs a token even to read. Dependabot uses its
# own GITHUB_TOKEN for that (no PAT): the package grants this repo Read under "Manage Actions
# access". There is deliberately no `registries` block — explicit registry credentials would take
# precedence over that built-in token. The scope -> registry mapping it relies on is in the
# committed .npmrc.
#
# There is no CI workflow yet, so add a github-actions entry here when one arrives.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the Node major we run on (engines: >=24) — bumped in lockstep with
      # the runtime, not on Dependabot's schedule. Minor/patch within it still flow.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
